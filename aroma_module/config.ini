# Configuration file location on the Wii U SD card:
#   SD:/wiiu/ax88179/config.ini

[dhcp]
# DHCP mode:
#   keep_first = Use DHCP for the first successful connection, then reuse
#                the assigned IP configuration for the rest of the Aroma session.
#
#   always     = Perform a new DHCP negotiation after every title transition.
#
# Valid values: keep_first, always
mode=keep_first

[debug]
# 0 = désactivé
# 1 = socket/connect/bind/DNS/ioctl/select/etc.
# 2 = verbeux, incluant send/recv
shim_trace=0

[compat]
# ax = DNS through lwIP/AX88179
# native = route game sockets through the original Wii U networking stack
# system = leave DNS to nsysnet/Inkay
dns=system
route=ax

# native = ancien comportement : promotion de la socket AX vers Wi-Fi natif
# bridge = Nintendo NSSL -> 127.0.0.1 -> relay -> lwIP -> AX88179
nssl=bridge
